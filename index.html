<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Until We Meet Again</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop">
    <div class="slide" data-layer="a"></div>
    <div class="slide" data-layer="b"></div>
    <div class="scrim"></div>
  </div>

  <button class="arrow arrow--prev" id="prev" aria-label="Previous photo">&#8249;</button>
  <button class="arrow arrow--next" id="next" aria-label="Next photo">&#8250;</button>

  <main class="card">
    <button class="card__min" id="minimize" aria-expanded="true" aria-label="Minimize">
      <span class="card__chev" aria-hidden="true">&#8964;</span>
    </button>

    <p class="eyebrow">Until we meet again</p>

    <section class="countdown" id="countdown" aria-live="polite">
      <div class="tile"><span class="tile__num" id="cd-days">--</span><span class="tile__label">days</span></div>
      <div class="tile"><span class="tile__num" id="cd-hours">--</span><span class="tile__label">hours</span></div>
      <div class="tile"><span class="tile__num" id="cd-mins">--</span><span class="tile__label">minutes</span></div>
      <div class="tile"><span class="tile__num" id="cd-secs">--</span><span class="tile__label">seconds</span></div>
    </section>

    <p class="reunited" id="reunited" hidden>We're together! &#128149;</p>
    <p class="meeting-date" id="meeting-date"></p>

    <div class="toggle" role="tablist" aria-label="Choose a person">
      <span class="toggle__pill" id="pill" aria-hidden="true"></span>
      <button class="toggle__btn" role="tab" id="tab-john" data-person="john" aria-selected="true">Seungho</button>
      <button class="toggle__btn" role="tab" id="tab-mary" data-person="mary" aria-selected="false">Michelle</button>
    </div>

    <section class="panel" aria-live="polite">
      <p class="panel__city" id="city">&nbsp;</p>
      <p class="panel__time" id="clock">--:--:--</p>
      <p class="panel__date" id="localdate">&nbsp;</p>

      <div class="weather" id="weather">
        <span class="weather__icon" id="wx-icon">&#127777;&#65039;</span>
        <div class="weather__body">
          <p class="weather__temp" id="wx-temp">--&deg;</p>
          <p class="weather__label" id="wx-label">Loading weather&hellip;</p>
        </div>

        <!-- Direct child of the row, so it centres against the row's full
             height rather than against the temperature line. -->
        <p class="weather__range">
          <span class="weather__hi" id="wx-hi"></span>
          <span class="weather__lo" id="wx-lo"></span>
        </p>
        <!-- Mainland US, Albers projection; city pins sit at their real
             projected coordinates. Only the selected person's pin shows. -->
        <svg class="weather__map" viewBox="-6 -6 112 74" aria-hidden="true">
          <path class="map__land" d="M53.0 5.1L53.8 6.8L58.2 7.9L62.0 8.0L63.4 7.2L69.5 10.0L70.1 11.0L70.8 10.8L71.9 12.3L73.8 13.2L75.2 17.4L74.0 21.2L74.9 22.1L81.0 18.2L80.3 16.8L81.0 16.3L84.3 15.6L86.8 11.7L92.4 10.3L93.5 8.9L94.5 3.6L97.1 3.8L98.0 6.9L100.0 8.6L95.6 12.8L95.2 16.2L96.1 17.3L96.9 17.2L96.5 16.4L97.1 16.8L97.2 17.5L91.1 20.8L94.2 20.1L90.7 21.4L90.9 23.9L90.0 26.1L88.6 25.0L90.0 27.4L89.0 30.6L89.1 28.8L87.9 28.1L87.3 26.1L87.9 28.7L86.6 28.5L88.0 29.1L90.3 34.5L89.4 36.5L85.6 39.6L81.1 46.3L81.6 49.7L85.5 56.8L85.8 59.3L84.9 61.3L83.7 61.1L80.9 57.9L79.2 55.3L79.4 53.7L76.7 50.6L75.9 50.4L73.9 51.7L71.0 50.2L64.4 51.3L65.0 53.7L61.9 53.9L60.3 52.7L56.9 52.6L53.8 53.4L48.6 57.4L48.1 60.1L48.6 62.1L47.7 62.1L44.5 60.8L43.5 57.9L40.7 53.4L39.2 52.3L37.5 52.3L36.1 54.1L33.3 52.4L32.4 49.7L29.6 46.7L26.1 46.3L26.0 47.3L20.3 46.5L13.2 42.3L13.5 41.8L8.6 41.3L6.8 37.1L3.1 34.7L0.0 19.4L1.5 15.5L1.5 13.6L4.5 7.5L5.5 0.6L7.5 2.1L7.7 4.5L8.6 0.0L19.1 2.7L33.4 5.0L49.1 6.0L52.4 6.0L53.0 5.1Z"/>
          <g transform="translate(7.3 37.2)">
            <g class="map__pin" data-pin="john"><path class="map__heart" d="M0 -3.15C-1.8 -6.15 -5.85 -4.95 -5.85 -1.5C-5.85 2.25 -1.65 4.65 0 6.45C1.65 4.65 5.85 2.25 5.85 -1.5C5.85 -4.95 1.8 -6.15 0 -3.15Z"/></g>
          </g>
          <g transform="translate(94.5 17.7)">
            <g class="map__pin" data-pin="mary"><path class="map__heart" d="M0 -3.15C-1.8 -6.15 -5.85 -4.95 -5.85 -1.5C-5.85 2.25 -1.65 4.65 0 6.45C1.65 4.65 5.85 2.25 5.85 -1.5C5.85 -4.95 1.8 -6.15 0 -3.15Z"/></g>
          </g>
        </svg>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
